    <script>
      (function() {
        // 1. Intercept and suppress external chrome-extension errors from polluting the app
        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var stack = (e.reason && (e.reason.stack || e.reason.message)) || '';
          if (stack.indexOf('chrome-extension://') !== -1 || stack.indexOf('fetch') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);

        // 2. Make fetch writable on all levels (window, Window.prototype, etc.)
        try {
          var currentFetch = window.fetch;
          var targets = [window];
          if (typeof Window !== 'undefined' && Window.prototype) {
            targets.push(Window.prototype);
          }
          if (window.__proto__) {
            targets.push(window.__proto__);
          }

          targets.forEach(function(target) {
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (err) {}
          });
        } catch (e) {}
      })();
    </script>
